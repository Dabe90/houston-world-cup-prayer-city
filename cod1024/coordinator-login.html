<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coordinator login — Class of David 1024</title>
  <link rel="stylesheet" href="/css/cod1024.css?v=20261116f" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/cod1024">Class of David 1024</a>
      <nav class="nav-links">
        <a href="/cod1024">Home</a>
        <a href="/cod1024/register">Register</a>
        <a href="/cod1024/students">Sign in</a>
        <a href="/cod1024/coordinator-login" aria-current="page">Coordinator</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1>Coordinator login</h1>
    <p class="lede">Same coordinator accounts as Class of David. After you sign in you can switch to the 9-month program from the coordinator bar.</p>
    <div class="panel" style="max-width:440px;">
      <div id="msg" class="msg info" hidden></div>
      <form id="login-form">
        <label for="who">I am signing in as</label>
        <select id="who" required>
          <option value="">Select coordinator</option>
          <option value="damilola">Abe Damilola (President)</option>
          <option value="cecilia">Cecilia Alabede</option>
          <option value="veronica">Veronica Ekoja</option>
          <option value="amarachi">Nnodum Amarachi</option>
          <option value="elizabeth">Ojenor Elizabeth</option>
        </select>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <p style="margin-top:12px;">
        <button type="button" class="btn btn-ghost" id="btn-forgot" style="width:100%;">Forgot password</button>
      </p>
      <p style="margin-top:14px;color:var(--muted);font-size:0.92rem;">
        New coordinator? <a href="/cod1024/coordinator-register">Register</a>
      </p>
    </div>
  </main>
  <script>window.COD_PROGRAM = "cod1024";</script>
  <script src="/js/vendor/firebase/firebase-app-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-auth-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js?v=20261101a"></script>
  <script src="/js/cod-data.js"></script>
  <script src="/js/cod-program.js?v=20261116c"></script>
  <script src="/js/cod-firebase.js?v=20261116c"></script>
  <script>
    (function () {
      var form = document.getElementById("login-form");
      var msg = document.getElementById("msg");
      function show(t, k) {
        msg.hidden = false;
        msg.className = "msg " + k;
        msg.textContent = t;
      }
      function go(role) {
        if (role === "admin") window.location.href = "/cod/admin.html";
        else if (role === "coordinator") window.location.href = "/cod1024/coordinator";
        else if (role === "pending_coordinator") window.location.href = "/cod1024/coordinator-pending";
        else show("This account is not a coordinator.", "err");
      }
      if (!window.COD_FIREBASE.init()) {
        show("Sign-in is not available.", "err");
        return;
      }
      window.COD_FIREBASE.auth().onAuthStateChanged(function (user) {
        if (!user) return;
        window.COD_FIREBASE.resolveRole(user).then(go);
      });
      document.getElementById("btn-forgot").addEventListener("click", function () {
        var email = document.getElementById("email").value.trim();
        if (!email) {
          show("Enter your email first.", "err");
          return;
        }
        show("Sending reset email…", "info");
        window.COD_FIREBASE.sendPasswordReset(email, {
          continueUrl: location.origin + "/cod1024/coordinator-login",
        })
          .then(function (e) {
            show("Check " + e + " (and spam).", "ok");
          })
          .catch(function (err) {
            show(window.COD_FIREBASE.friendlyAuthError(err), "err");
          });
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var who = document.getElementById("who").value;
        if (window.COD_DATA && window.COD_DATA.isAdminEmail(email.toLowerCase())) {
          window.location.href = "/cod/admin.html";
          return;
        }
        window.COD_FIREBASE.auth()
          .signInWithEmailAndPassword(email, password)
          .then(function (cred) {
            return window.COD_FIREBASE.resolveRole(cred.user).then(function (role) {
              if (role === "pending_coordinator" || role === "coordinator" || role === "admin") return role;
              return window.COD_FIREBASE.ensureCoordinatorProfile(cred.user, who).then(function () {
                return window.COD_FIREBASE.resolveRole(cred.user);
              });
            });
          })
          .then(go)
          .catch(function (err) {
            show(window.COD_FIREBASE.friendlyAuthError(err), "err");
          });
      });
    })();
  </script>
</body>
</html>
