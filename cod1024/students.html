<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120e24" />
  <link rel="icon" type="image/png" href="/images/cod1024-favicon.png" />
  <title>Sign in — Class of David 1024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" />
  <link rel="stylesheet" href="/css/cod1024.css?v=20261116j" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/cod1024"><span class="brand-mark">1024</span><span>Class of David<small>Dear Daughter Bible Study</small></span></a>
      <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button>
      <nav class="nav-links" aria-label="Main">
        <a href="/cod1024">Home</a>
        <a href="/cod1024/register" data-cod-hide-when-signed-in>Register</a>
        <span data-cod-auth-nav id="cod-auth-nav"></span>
      </nav>
    </div>
  </header>

  <main class="auth-shell">
    <aside class="auth-art">
      <img src="/images/cod1024-hero.jpg" alt="" width="1024" height="576" />
      <div>
        <h2>Welcome back.</h2>
      </div>
    </aside>
    <div class="auth-main">
      <div class="auth-card">
        <div data-cod-show-when-signed-in hidden>
          <h1>Opening your portal…</h1>
        </div>
        <div data-cod-hide-when-signed-in>
          <img class="logo auth-logo" src="/images/dear-daughter-logo.png" alt="Dear Daughter Bible Study" width="225" height="210" />
          <h1>Sign in</h1>
          <div class="panel">
            <div id="msg" class="msg info" hidden></div>
            <form id="login-form">
              <label for="email">Email</label>
              <input id="email" type="email" required autocomplete="username" />
              <label for="password">Password</label>
              <input id="password" type="password" required autocomplete="current-password" />
              <button class="btn btn-primary btn-block" type="submit" id="btn-login">Sign in</button>
            </form>
            <p style="margin:12px 0 0;">
              <button type="button" class="btn btn-ghost btn-block" id="btn-forgot">Forgot password</button>
            </p>
          </div>
          <div class="auth-alt">
            <p>New student? <a href="/cod1024/register">Create your account</a></p>
            <p>New coordinator? <a href="/cod1024/coordinator-register">Request access from the President</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>window.COD_PROGRAM = "cod1024";</script>
  <script src="/js/cod-1024-site.js?v=20261116j"></script>
  <script src="/js/vendor/firebase/firebase-app-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-auth-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js?v=20261101a"></script>
  <script src="/js/cod-data.js"></script>
  <script src="/js/cod-program.js?v=20261116i"></script>
  <script src="/js/cod-firebase.js?v=20261116r"></script>
  <script src="/js/cod-auth-bar.js?v=20261116j"></script>
  <script>
    (function () {
      var form = document.getElementById("login-form");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn-login");
      function show(t, k) {
        msg.hidden = false;
        msg.className = "msg " + k;
        msg.textContent = t;
      }
      if (!window.COD_FIREBASE.init()) {
        show("Sign-in is not available.", "err");
        return;
      }
      function go(user) {
        return window.COD_FIREBASE.resolveRole(user).then(function (role) {
          if (role === "admin" || role === "coordinator") {
            window.location.href = "/cod1024/coordinator";
            return;
          }
          if (role === "pending_coordinator") {
            window.location.href = "/cod1024/coordinator-pending";
            return;
          }
          return window.COD_FIREBASE.getProfile(user.uid).then(function (p) {
            if (!p) {
              window.location.href = "/cod1024/register?existing=1";
              return;
            }
            window.location.href = window.COD_PROGRAM_CTX.studentPortalForProfile(p);
          });
        });
      }
      window.COD_FIREBASE.auth().onAuthStateChanged(function (user) {
        if (user) go(user);
      });
      document.getElementById("btn-forgot").addEventListener("click", function () {
        var email = document.getElementById("email").value.trim();
        if (!email) {
          show("Enter your email first.", "err");
          return;
        }
        show("Sending reset email…", "info");
        window.COD_FIREBASE.sendPasswordReset(email, {
          continueUrl: location.origin + "/cod1024/students",
        })
          .then(function (e) {
            show("Check " + e + " (and spam) for the reset link.", "ok");
          })
          .catch(function (err) {
            show(window.COD_FIREBASE.friendlyAuthError(err), "err");
          });
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        btn.disabled = true;
        show("Signing in…", "info");
        window.COD_FIREBASE.auth()
          .signInWithEmailAndPassword(
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
          )
          .then(function (cred) {
            return go(cred.user);
          })
          .catch(function (err) {
            btn.disabled = false;
            show(window.COD_FIREBASE.friendlyAuthError(err), "err");
          });
      });
    })();
  </script>
</body>
</html>
