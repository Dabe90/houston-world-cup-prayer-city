<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120e24" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Coordinator access — Class of David 1024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" />
  <link rel="stylesheet" href="/css/cod1024.css?v=20261116j" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/cod1024"><span class="brand-mark">1024</span><span>Class of David<small>Dear Daughter Bible Study</small></span></a>
      <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button>
      <nav class="nav-links" aria-label="Main">
        <a href="/cod1024">Home</a>
        <a href="/cod1024/students">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="auth-shell">
    <aside class="auth-art">
      <img src="/images/cod1024-hero.jpg" alt="" width="1024" height="576" />
      <div>
        <h2>Coordinators</h2>
      </div>
    </aside>
    <div class="auth-main">
      <div class="auth-card">
        <img class="logo auth-logo" src="/images/dear-daughter-logo.png" alt="Dear Daughter Bible Study" width="225" height="210" />
        <h1>Request access</h1>
        <div class="panel">
          <div id="msg" class="msg info" hidden></div>
          <form id="reg-form">
            <label for="who">I am</label>
            <select id="who" required>
              <option value="">Select your name</option>
              <option value="cecilia">Cecilia Alabede</option>
              <option value="veronica">Veronica Ekoja</option>
              <option value="amarachi">Nnodum Amarachi</option>
              <option value="elizabeth">Ojenor Elizabeth</option>
            </select>
            <div class="form-row">
              <div>
                <label for="first">First name</label>
                <input id="first" required autocomplete="given-name" />
              </div>
              <div>
                <label for="last">Last name</label>
                <input id="last" required autocomplete="family-name" />
              </div>
            </div>
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" />
            <label for="phone">Phone</label>
            <input id="phone" type="tel" autocomplete="tel" />
            <label for="password">Password (8+ characters)</label>
            <input id="password" type="password" required minlength="8" autocomplete="new-password" />
            <button class="btn btn-primary btn-block" type="submit" id="btn-submit">Submit for approval</button>
          </form>
        </div>
        <div class="auth-alt">
          <p>Already approved? <a href="/cod1024/students">Sign in</a></p>
        </div>
      </div>
    </div>
  </main>

  <script>window.COD_PROGRAM = "cod1024";</script>
  <script src="/js/cod-1024-site.js?v=20261116j"></script>
  <script src="/js/vendor/firebase/firebase-app-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-auth-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js?v=20261101a"></script>
  <script src="/js/cod-data.js"></script>
  <script src="/js/cod-program.js?v=20261116i"></script>
  <script src="/js/cod-firebase.js?v=20261116c"></script>
  <script>
    (function () {
      var form = document.getElementById("reg-form");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn-submit");
      function show(t, k) {
        msg.hidden = false;
        msg.className = "msg " + k;
        msg.textContent = t;
      }
      if (!window.COD_FIREBASE.init()) {
        show("Registration is not available.", "err");
        btn.disabled = true;
        return;
      }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        btn.disabled = true;
        show("Sending your request…", "info");
        window.COD_FIREBASE.registerCoordinator({
          coordinatorId: document.getElementById("who").value,
          first: document.getElementById("first").value,
          last: document.getElementById("last").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          password: document.getElementById("password").value,
        })
          .then(function (res) {
            if (res && res.status === "coordinator") {
              window.location.href = "/cod1024/coordinator";
              return;
            }
            window.location.href = "/cod1024/coordinator-pending";
          })
          .catch(function (err) {
            btn.disabled = false;
            show(window.COD_FIREBASE.friendlyAuthError(err), "err");
          });
      });
    })();
  </script>
</body>
</html>
