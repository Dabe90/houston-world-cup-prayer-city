<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculum — President's office</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/cod/academy.css?v=20261103m" />
</head>
<body>
  <header class="nav">
    <div class="wrap-wide nav-inner">
      <a class="brand" href="/cod/"><img src="/cod/logo.png" alt="" width="40" height="40" /><span>Class of David</span></a>
      <nav class="nav-links">
        <a href="/cod/admin.html">Office home</a>
        <span data-cod-auth-nav id="cod-auth-nav"></span>
      </nav>
    </div>
  </header>

  <main class="wrap-wide hero">
    <div id="gate" class="card">Loading…</div>
    <div id="portal" hidden>
      <p class="kicker">President's office</p>
      <h1>Nine-year curriculum</h1>
      <p class="section-lead">One calendar month per academic year — assignment publish status.</p>
      <div id="office-nav"></div>
      <div class="card" id="curriculum-progress"></div>
      <div class="card" style="margin-top:20px;">
        <h2 style="font-family:var(--head);margin:0 0 8px;">Staff class files and Sample HW</h2>
        <p style="font-size:0.88rem;color:var(--muted);">Coordinators see only their years on their dashboard. You can open every year here. Students cannot.</p>
        <div id="all-years"></div>
      </div>
    </div>
  </main>

  <script src="/js/vendor/firebase/firebase-app-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-auth-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="/js/vendor/firebase/firebase-storage-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/cod-data.js"></script>
  <script src="/js/cod-firebase.js"></script>
  <script src="/js/cod-president-dashboard.js"></script>
  <script src="/js/cod-president-office.js"></script>
  <script src="/js/cod-staff-materials.js?v=20261103m"></script>
  <script src="/js/cod-staff-materials-ui.js?v=20261103m"></script>
  <script src="/js/cod-auth-bar.js"></script>
  <script>
    window.COD_PRESIDENT_OFFICE.boot("curriculum", function () {
      window.COD_FIREBASE.getSettings().then(function (s) {
        window.COD_PRESIDENT_DASH.refreshPresidentDashboard(s);
      });
      if (window.COD_STAFF_UI) {
        window.COD_STAFF_UI.renderAllYears(document.getElementById("all-years"));
        window.COD_STAFF_UI.bindDownloads(document.getElementById("portal"));
      }
    });
  </script>
</body>
</html>
