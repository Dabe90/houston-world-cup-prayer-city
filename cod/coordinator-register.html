<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinator registration — Class of David</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/cod/academy.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/cod/"><img src="/cod/logo.png" alt="" width="40" height="40" /><span>Class of David</span></a>
      <nav class="nav-links">
        <a href="/cod/coordinator-login.html">Coordinator login</a>
      </nav>
    </div>
  </header>

  <main class="wrap hero">
    <p class="kicker">Coordinators</p>
    <h1>Register as a coordinator</h1>
    <p style="color:var(--muted);max-width:560px;">
      Create your own login here. After you register, the President approves your account.
      Then you can draft assignments and mark student work.
    </p>

    <div class="card" style="max-width:480px;margin-top:24px;">
      <div id="msg" class="msg info" hidden></div>
      <form id="reg-form">
        <label for="who">I am</label>
        <select id="who" required>
          <option value="">Select coordinator</option>
          <option value="cecilia">Cecilia Alabede</option>
          <option value="veronica">Veronica Ekoja</option>
          <option value="amarachi">Nnodum Amarachi</option>
          <option value="elizabeth">Ojenor Elizabeth</option>
        </select>
        <label for="first">First name</label>
        <input id="first" required autocomplete="given-name" />
        <label for="last">Last name</label>
        <input id="last" required autocomplete="family-name" />
        <label for="email">Email (you will sign in with this)</label>
        <input id="email" type="email" required autocomplete="email" />
        <label for="phone">Phone</label>
        <input id="phone" type="tel" autocomplete="tel" />
        <label for="password">Password (8+ characters)</label>
        <input id="password" type="password" required minlength="8" autocomplete="new-password" />
        <button class="btn btn-primary" type="submit" id="btn-submit">Submit for approval</button>
      </form>
      <p style="margin-top:16px;font-size:0.9rem;color:var(--muted);">
        Already approved? <a href="/cod/coordinator-login.html">Sign in</a>
      </p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/cod-data.js"></script>
  <script src="/js/cod-firebase.js"></script>
  <script>
    (function () {
      var form = document.getElementById("reg-form");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn-submit");
      function show(t, k) {
        msg.hidden = false;
        msg.className = "msg " + k;
        msg.textContent = t;
      }
      if (!window.COD_FIREBASE.init()) {
        show("Firebase is not configured.", "err");
        btn.disabled = true;
        return;
      }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        btn.disabled = true;
        show("Creating account…", "info");
        window.COD_FIREBASE.registerCoordinator({
          coordinatorId: document.getElementById("who").value,
          first: document.getElementById("first").value,
          last: document.getElementById("last").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          password: document.getElementById("password").value,
        })
          .then(function () {
            show(
              "Registration received. The President will approve your account. You can sign in after approval.",
              "ok"
            );
            setTimeout(function () {
              window.location.href = "/cod/coordinator-pending.html";
            }, 2000);
          })
          .catch(function (err) {
            btn.disabled = false;
            show(err.message || String(err), "err");
          });
      });
    })();
  </script>
</body>
</html>
