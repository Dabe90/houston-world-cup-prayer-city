<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student login — Class of David</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/cod/academy.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/cod/"><img src="/cod/logo.png" alt="" width="40" height="40" /><span>Class of David</span></a>
      <nav class="nav-links">
        <a href="/cod/register.html">Register</a>
        <a class="active" href="/cod/login.html">Student login</a>
        <a href="/cod/coordinator-login.html">Coordinator login</a>
      </nav>
    </div>
  </header>

  <main class="wrap hero">
    <h1>Student login</h1>
    <div class="card" style="max-width:420px;margin-top:20px;">
      <div id="msg" class="msg info" hidden></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <p style="margin-top:14px;">
        <button type="button" class="btn btn-outline" id="btn-forgot" style="width:100%;">Forgot password</button>
      </p>
      <p style="margin-top:16px;font-size:0.9rem;color:var(--muted);">
        New student? <a href="/cod/register.html">Register here</a>
      </p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/cod-data.js"></script>
  <script src="/js/cod-firebase.js"></script>
  <script>
    (function () {
      var form = document.getElementById("login-form");
      var msg = document.getElementById("msg");
      function show(t, k) {
        msg.hidden = false;
        msg.className = "msg " + k;
        msg.textContent = t;
      }
      if (!window.COD_FIREBASE.init()) {
        show("Firebase not configured.", "err");
        return;
      }
      window.COD_FIREBASE.auth().onAuthStateChanged(function (user) {
        if (!user) return;
        window.COD_FIREBASE.resolveRole(user).then(function (role) {
          if (role === "admin") window.location.href = "/cod/admin.html";
          else if (role === "coordinator") window.location.href = "/cod/coordinator.html";
          else if (role === "pending_coordinator") window.location.href = "/cod/coordinator-pending.html";
          else window.location.href = "/cod/student.html";
        });
      });
      document.getElementById("btn-forgot").addEventListener("click", function () {
        var email = document.getElementById("email").value.trim();
        if (!email) {
          show("Enter your email first.", "err");
          return;
        }
        window.COD_FIREBASE.sendPasswordReset(email)
          .then(function (e) {
            show("Check " + e + " for a password reset link.", "ok");
          })
          .catch(function (err) {
            show(window.COD_FIREBASE.friendlyAuthError(err), "err");
          });
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        window.COD_FIREBASE.auth()
          .signInWithEmailAndPassword(email, password)
          .catch(function (err) {
            show(window.COD_FIREBASE.friendlyAuthError(err), "err");
          });
      });
    })();
  </script>
</body>
</html>
